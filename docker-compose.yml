# Retro-Homepage für Unraid (Alternative zur Unraid-Vorlage in unraid/retro-homepage.xml)
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d
services:
  homepage:
    image: ghcr.io/99dancor/retro-homepage:latest
    # Statt das fertige Image zu laden, kann es auch lokal gebaut werden:
    # build: .
    container_name: retro-homepage
    restart: unless-stopped
    ports:
      - "8080:3000"          # Unraid-Port 8080 -> Container-Port 3000 (in NPM eintragen)
    volumes:
      - /mnt/user/appdata/retro-homepage:/data
    environment:
      TZ: Europe/Berlin
      PUID: "99"             # Unraid-Standard nobody:users
      PGID: "100"
      ADMIN_USER: admin
      # Nur beim allerersten Start relevant. Leer lassen = zufälliges Passwort im Container-Log.
      ADMIN_PASSWORD: ""
      # Maximale Upload-Größe pro Datei in MB
      MAX_UPLOAD_MB: "4096"
      # Wem wird X-Forwarded-For geglaubt? Standard: private Netze (dein Raspberry Pi mit NPM).
      # TRUST_PROXY: "192.168.178.50"
